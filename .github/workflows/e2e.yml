name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    name: Playwright (no agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Deterministic, fast, and free: the specs were generated from
      # e2e/intents/ on a developer machine and committed. No Antigravity here.
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

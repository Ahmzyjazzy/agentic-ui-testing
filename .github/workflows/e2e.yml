name: e2e

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; the publishing job widens it for itself.
permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (no agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Deterministic, fast, and free: the specs were generated from
      # e2e/intents/ on a developer machine and committed. No Antigravity here.
      # CI=true, so playwright.config.ts records a video and a trace per test.
      - id: run-tests
        run: pnpm exec playwright test

      # Way 1 — download it. The zip on this run's page; unzip, open index.html.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Way 2 — stage the same report for the GitHub Pages job below.
      # grafana-image / grafana-version are required inputs of this action and
      # only end up in the published folder name; nothing here uses Grafana.
      - uses: grafana/plugin-actions/playwright-gh-pages/upload-report-artifacts@main
        if: ${{ always() && !cancelled() }}
        with:
          test-outcome: ${{ steps.run-tests.outcome }}
          grafana-image: bookmi
          grafana-version: demo
          upload-successful-reports: true

  publish-report:
    name: Publish report to GitHub Pages
    needs: [playwright]
    # Runs whether the suite passed or failed — a green report is worth seeing
    # too. Skipped for pull requests from forks, which have no write token.
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the report to the gh-pages branch
      pull-requests: write   # comment the report URL on the PR
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/plugin-actions/playwright-gh-pages/deploy-report-pages@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retention-days: 30
          pr-comment-summary: true
